<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Thành Viên Shop</title>
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #222222); }
    </style>
</head>
<body class="p-4 font-sans selection:bg-blue-500">

    <!-- Thanh thông tin thành viên & Ví tiền -->
    <div class="p-4 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white mb-6 shadow-md">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-xs opacity-75">Tài khoản thành viên</p>
                <h1 id="user-name" class="text-lg font-bold">Khách hàng</h1>
            </div>
            <div class="text-right">
                <p class="text-xs opacity-75">Số dư ví</p>
                <p id="user-balance" class="text-xl font-extrabold text-amber-300 mb-1">0 VND</p>
                <button onclick="openDepositModal()" class="px-3 py-1 bg-white text-blue-600 font-bold rounded-lg text-xs shadow-xs cursor-pointer active:scale-95 transition-transform">
                    ➕ Nạp tiền
                </button>
            </div>
        </div>
    </div>

    <!-- Danh sách sản phẩm -->
    <h2 class="text-sm font-semibold uppercase tracking-wider mb-3 text-gray-400">Kho tài nguyên hiện có</h2>
    <div id="product-list" class="space-y-3">
        <div class="animate-pulse bg-gray-100 dark:bg-gray-800 h-20 rounded-xl"></div>
    </div>

    <!-- POPUP MODAL NẠP TIỀN TỰ ĐỘNG -->
    <div id="deposit-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 backdrop-blur-xs z-50">
        <div class="bg-[var(--tg-theme-bg-color,#fff)] p-5 rounded-2xl w-full max-w-sm shadow-xl text-center border border-gray-200 dark:border-gray-800">
            <h3 class="text-lg font-bold mb-2">Nạp tiền vào ví</h3>
            <div class="mb-4 text-left">
                <label class="text-xs text-gray-400 block mb-1">Nhập số tiền muốn nạp (VND):</label>
                <input type="number" id="deposit-amount" value="50000" step="10000" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent font-bold text-center text-lg">
                <button onclick="generateQR()" class="w-full mt-2 py-2 bg-gray-800 text-white font-medium rounded-xl text-xs cursor-pointer">Tạo mã QR quét nhanh</button>
            </div>
            <div id="qr-container" class="hidden my-4 p-2 bg-white rounded-xl inline-block border border-gray-100">
                <img id="qr-image" src="" alt="VietQR" class="w-48 h-48 mx-auto">
                <div class="mt-2 text-xs text-gray-600 font-mono space-y-1 text-left bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                    <p>Ngân hàng: <span id="info-bank" class="font-bold text-black"></span></p>
                    <p>Số tài khoản: <span id="info-stk" class="font-bold text-black"></span></p>
                    <p>Nội dung chuyển: <span id="info-syntax" class="font-bold text-red-500"></span></p>
                </div>
                <p class="text-[10px] text-amber-500 mt-2">💡 Tiền sẽ tự cộng vào ví sau 30s - 1 phút sau khi chuyển thành công.</p>
            </div>
            <button onclick="closeDepositModal()" class="w-full py-2.5 mt-2 rounded-xl border border-gray-300 text-sm font-medium cursor-pointer">Đóng cửa sổ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Đường link máy chủ Render của bạn đã được cấu hình sẵn tại đây
        const API_URL = "https://onrender.com";
        
        const userId = tg.initDataUnsafe?.user?.id || 9999; 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        async function fetchUserWallet() {
            try {
                const response = await fetch(`${API_URL}/api/user/${userId}`);
                const data = await response.json();
                document.getElementById('user-balance').innerText = `${data.balance.toLocaleString()} VND`;
            } catch (error) { console.error("Lỗi ví tiền"); }
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const products = await response.json();
                const container = document.getElementById('product-list');
                container.innerHTML = '';

                products.forEach(p => {
                    container.innerHTML += `
                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-[var(--tg-theme-secondary-bg-color,#f8fafc)] flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-base">${p.name}</h3>
                                <p class="text-xs text-gray-400 mt-0.5">${p.description || ''}</p>
                                <span class="inline-block mt-1 text-sm font-semibold text-blue-500">${p.price.toLocaleString()}đ</span>
                            </div>
                            <button onclick="confirmPurchase(${p.id}, '${p.name}', ${p.price})" class="px-4 py-2.5 bg-blue-600 text-white text-xs font-bold rounded-xl shadow-xs cursor-pointer active:scale-95 transition-transform">
                                Trừ Ví mua
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('product-list').innerHTML = '<p class="text-red-500 text-sm text-center">Lỗi kết nối máy chủ.</p>';
            }
        }

        function confirmPurchase(productId, productName, price) {
            tg.showConfirm(`Bạn có chắc chắn muốn dùng ví để mua: "${productName}" với giá ${price.toLocaleString()}đ?`, async (approved) => {
                if (approved) { executePurchase(productId); }
            });
        }

        async function executePurchase(productId) {
            tg.showProgress();
            try {
                const response = await fetch(`${API_URL}/api/buy-product`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, product_id: productId })
                });
                const data = await response.json();
                tg.hideProgress();

                if (data.status === "SUCCESS") {
                    document.getElementById('user-balance').innerText = `${data.new_balance.toLocaleString()} VND`;
                    tg.showPopup({
                        title: '🛒 Mua thành công!',
                        message: `Hệ thống đã trừ tiền ví thành công.\n\n🔑 Tài nguyên của bạn:\n${data.resource}`,
                        buttons: [{type: 'ok'}]
                    });
                } else { tg.showAlert(data.message); }
            } catch (e) {
                tg.hideProgress();
                tg.showAlert("Có lỗi kết nối.");
            }
        }

        fn openDepositModal() {
            document.getElementById('deposit-modal').classList.remove('hidden');
            document.getElementById('qr-container').classList.add('hidden');
        }

        function closeDepositModal() {
            document.getElementById('deposit-modal').classList.add('hidden');
            fetchUserWallet();
        }

        async function generateQR() {
            const amount = document.getElementById('deposit-amount').value;
            if (amount < 1000) { tg.showAlert("Số tiền tối thiểu là 1,000 VND"); return; }
            tg.showProgress();
            try {
                const response = await fetch(`${API_URL}/api/deposit-qr/${userId}?amount=${amount}`);
                const data = await response.json();
                tg.hideProgress();
                if (data.qr_url) {
                    document.getElementById('qr-image').src = data.qr_url;
                    document.getElementById('info-bank').innerText = data.bank_name;
                    document.getElementById('info-stk').innerText = data.account_number;
                    document.getElementById('info-syntax').innerText = data.syntax;
                    document.getElementById('qr-container').classList.remove('hidden');
                }
            } catch (e) { tg.hideProgress(); tg.showAlert("Lỗi tạo mã QR."); }
        }

        fetchUserWallet();
        fetchProducts();
    </script>
</body>
</html>
